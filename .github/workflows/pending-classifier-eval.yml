name: Pending prompt classifier eval

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Classifier accuracy (Workers AI)
        env:
          DESK_PENDING_CLASSIFIER_EVAL: "1"
          WORKERS_AI_MODEL: ${{ secrets.WORKERS_AI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run test -w @chatbot/runtime -- --run pending-prompt-classifier.test.ts
